<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#3c1e69">
<title>高考志愿</title>
<style>
:root{
  --w:414px;
  --purple:#3c1e69;
  --active:#826aa7;
  --grad1:#584bdd;
  --grad2:#aa55ff;
  --placeholder:#e8e8e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f4f4f4;color:#303030;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
button{font:inherit;border:0;background:none;padding:0}
#app{
  width:min(100vw,var(--w));
  min-height:100vh;
  background:#fff;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 24px rgba(0,0,0,.08);
}
.screen{
  position:absolute;inset:0;
  background:#fff;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transform:translateX(0);
  transition:opacity .3s ease-out;
}
.screen.active{opacity:1;pointer-events:auto}
.status{
  height:35px;flex:none;
  background:var(--purple);color:#fff;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 10px;
  font-size:14px;font-weight:600;
  position:relative;z-index:3;
}
.status .icons{display:flex;align-items:center;gap:6px}
.signal{display:flex;align-items:flex-end;gap:2px;height:14px}
.signal i{display:block;width:2px;background:#fff;border-radius:1px}
.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:11px}.signal i:nth-child(4){height:14px}
.wifi{width:16px;height:11px;border:2px solid #fff;border-top-left-radius:12px;border-top-right-radius:12px;border-bottom:0;position:relative}
.wifi:after{content:"";position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;left:4px;bottom:-4px}
.battery{width:24px;height:12px;border:1.7px solid #fff;border-radius:3px;position:relative}
.battery:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;background:#fff;border-radius:1px}
.battery:before{content:"";position:absolute;inset:2px 2px 2px 3px;background:#fff;border-radius:1px}
.header{
  height:60px;flex:none;
  background:linear-gradient(116deg,var(--grad1),var(--grad2));
  color:#fff;display:flex;align-items:center;justify-content:center;
  position:relative;z-index:2;
}
.header .back{
  position:absolute;left:12px;top:0;width:46px;height:60px;
  color:#fff;font-size:38px;line-height:54px;text-align:left;font-weight:300;
}
.header h1{font-size:23px;font-weight:400;margin:0}
.content{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.bottom{
  height:50px;flex:none;background:var(--purple);
  display:grid;grid-template-columns:repeat(4,1fr);
  color:#fff;position:relative;z-index:5;
}
.nav{
  color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;touch-action:manipulation;
}
.nav.active{background:var(--active)}
.nav:active,.tile:active,.card:active{opacity:.72}
.home-content{padding:28px 25px 78px}
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:61px 20px;justify-items:center}
.tile{
  width:90px;height:90px;border-radius:50%;
  overflow:hidden;position:relative;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(145deg,#f0eef7,#d9d2ea);
  box-shadow:0 4px 10px rgba(60,30,105,.10);
}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .fallback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;text-align:center;background:linear-gradient(145deg,#826aa7,#584bdd);
}
.tile-label{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:100%;color:#fff;font-size:16px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.45);
  pointer-events:none;
}
.home-title{display:none}
.list-page{padding:30px 22px 70px}
.placeholder-list{display:flex;flex-direction:column;gap:20px}
.card{
  height:69px;background:var(--placeholder);cursor:pointer;touch-action:manipulation;
}
.planning-page{padding:30px 22px 70px}
.planning-page .card{height:111px;margin-bottom:47px}
.class-page{padding:30px 22px 70px}
.class-grid{display:grid;grid-template-columns:81px;row-gap:22px}
.class-page .card{width:81px;height:90px}
.result{font-size:16px;color:#acb2c3;margin:8px 22px 0}
.detail{
  min-height:100%;padding:28px 22px 80px;background:#fff;
}
.detail h2{font-size:22px;font-weight:500;margin:0 0 20px;color:#303030}
.detail p{font-size:15px;line-height:1.8;color:#666;margin:0 0 20px}
.backline{
  display:inline-flex;align-items:center;gap:8px;color:#584bdd;font-size:15px;margin-bottom:20px;
  cursor:pointer;touch-action:manipulation
}
@media(max-width:414px){
  #app{width:100vw;box-shadow:none}
  .home-content{padding-left:22px;padding-right:22px}
  .home-grid{gap:52px 12px}
}
</style>
</head>

function fillHome(){
  const grid=document.getElementById("homeGrid");
  grid.innerHTML="";
  homeItems.forEach(([label,key])=>{
    const b=document.createElement("button");
    b.className="tile";
    b.dataset.detail=label;
    if(imgMap[key]){
      const img=document.createElement("img");
      img.src=imgMap[key];
      img.alt="";
      b.appendChild(img);
    }else{
      const f=document.createElement("div");
      f.className="fallback";
      f.textContent=label.slice(0,2);
      b.appendChild(f);
    }
    const t=document.createElement("span");
    t.className="tile-label";
    t.textContent=label;
    b.appendChild(t);
    grid.appendChild(b);
  });
}
function makeCards(id,n,h){
  const el=document.getElementById(id);
  el.innerHTML="";
  for(let i=0;i<n;i++){
    const b=document.createElement("button");
    b.className="card";
    b.style.height=h+"px";
    b.dataset.detail = id==="infoList" ? ["政策资讯","招生信息","考试安排","成绩查询","录取信息","重要通知"][i] : "";
    el.appendChild(b);
  }
}
function show(page, push=true){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(page).classList.add("active");
  document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===page));
  if(push) history.pushState({page},"","#"+page);
}
function openDetail(title){
  document.getElementById("detailTitle").textContent=title;
  document.getElementById("detailH2").textContent=title;
  document.getElementById("detailP").textContent="这里是“"+title+"”功能页的开发入口。当前版本按照 XD 原型保留视觉风格与页面跳转结构，后续可以继续接入真实数据、搜索、筛选、登录、AI分析和数据库。";
  show("detail",true);
}
document.addEventListener("pointerup",e=>{
  const nav=e.target.closest("[data-page]");
  if(nav){ show(nav.dataset.page,true); return; }
  const back=e.target.closest("[data-back]");
  if(back){ history.back(); return; }
  const tile=e.target.closest("[data-detail]");
  if(tile){ openDetail(tile.dataset.detail); return; }
});
window.addEventListener("popstate",()=>{
  const p=location.hash.replace("#","");
  if(pages.includes(p)) show(p,false);
  else if(p==="detail") show("detail",false);
  else show("home",false);
});
fillHome();
makeCards("infoList",6,69);
makeCards("planningList",6,111);
const cl=document.getElementById("classList");
for(let i=0;i<4;i++){const b=document.createElement("button");b.className="card";b.dataset.detail="微课堂第"+(i+1)+"项";cl.appendChild(b);}
const initial=location.hash.replace("#","");
show(["home","info","planning","classroom","detail"].includes(initial)?initial:"home",false);
</script>
